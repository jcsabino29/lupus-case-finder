version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a few days before proposing them (supply-chain safety).
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    ignore:
      # Types track the Node runtime we deploy on (Node 24, see .nvmrc).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (native compiler) breaks the Next.js typecheck today; revisit deliberately.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
