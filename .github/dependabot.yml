version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a few days before proposing them (supply-chain safety).
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /worker
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
