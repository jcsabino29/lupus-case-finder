[project]
name = "lcf-worker"
version = "0.1.0"
description = "Batch extraction worker for Lupus Case Finder (synthetic data only)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Clinical NLP stack, installed in stage 2. Kept optional so CI stays fast.
nlp = [
  "spacy>=3.8,<4",
  "scispacy>=0.5.5",
  "medspacy>=1.3",
  "presidio-analyzer>=2.2",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "pip-audit>=2.7",
]

[project.scripts]
lcf-worker = "lcf_worker.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcf_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
